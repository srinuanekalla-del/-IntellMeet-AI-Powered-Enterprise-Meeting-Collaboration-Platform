# Runs the whole app locally:  docker compose up --build
# Secrets stay in server/.env (never baked into an image).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379   # overrides the localhost value in .env
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
